name: PHPCS report once

on:
  push:
    branches:
      - agent/public-release-hardening

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install tooling
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Capture PHPCS report
        shell: bash
        run: |
          set +e
          vendor/bin/phpcs --report=full > phpcs-report.txt 2>&1
          EXIT=$?
          set -e
          printf '\nPHPCS_EXIT=%s\n' "$EXIT" >> phpcs-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.txt
          if-no-files-found: error
