name: Format WordPress PHP once

on:
  push:
    branches:
      - agent/public-release-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-release-hardening

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install tooling
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Apply safe PHPCBF fixes
        shell: bash
        run: |
          set +e
          vendor/bin/phpcbf --report=summary
          EXIT=$?
          set -e
          # PHPCBF uses non-zero exit codes when it fixes files; continue and validate below.
          echo "phpcbf exit code: $EXIT"

      - name: Validate PHP syntax
        run: find no-comments -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify diff
        run: git diff --check

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- no-comments; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add no-comments
          git commit -m "Apply WordPress coding standards formatting [phpcbf-bot]"
          git push origin HEAD:agent/public-release-hardening
