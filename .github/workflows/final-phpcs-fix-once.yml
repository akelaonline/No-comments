name: Final PHPCS fix once

on:
  push:
    branches:
      - agent/public-release-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/public-release-hardening

      - name: Apply guarded fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('no-comments/no-comments.php')
          text = path.read_text()

          old = """        // translators: 1: author/company name, 2: website URL, 3: X profile URL, 4: Instagram profile URL.\n        echo '<p style=\"color:#475569;\">' . wp_kses_post( sprintf(\n            __( 'Desarrollado por %1$s — <a href=\"%2$s\" target=\"_blank\">Web</a> · <a href=\"%3$s\" target=\"_blank\">X</a> · <a href=\"%4$s\" target=\"_blank\">Instagram</a>', 'no-comments' ),"""
          new = """        echo '<p style=\"color:#475569;\">' . wp_kses_post( sprintf(\n            /* translators: 1: author/company name, 2: website URL, 3: X profile URL, 4: Instagram profile URL. */\n            __( 'Desarrollado por %1$s — <a href=\"%2$s\" target=\"_blank\">Web</a> · <a href=\"%3$s\" target=\"_blank\">X</a> · <a href=\"%4$s\" target=\"_blank\">Instagram</a>', 'no-comments' ),"""
          if text.count(old) != 1:
              raise SystemExit('branding translator replacement did not match exactly once')
          text = text.replace(old, new, 1)

          old = """        $types    = [];\n        $raw_types = isset( $_POST['delete_types'] ) && is_array( $_POST['delete_types'] ) ? wp_unslash( $_POST['delete_types'] ) : [];\n        foreach ( $raw_types as $t ) {"""
          new = """        $types = [];\n        // phpcs:ignore WordPress.Security.ValidatedSanitizedInput.InputNotSanitized -- Every array element is sanitized with sanitize_key() immediately below.\n        $raw_types = isset( $_POST['delete_types'] ) && is_array( $_POST['delete_types'] ) ? wp_unslash( $_POST['delete_types'] ) : [];\n        foreach ( $raw_types as $t ) {"""
          if text.count(old) != 1:
              raise SystemExit('delete types replacement did not match exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          php -l no-comments/no-comments.php
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add no-comments/no-comments.php
          git commit -m "Resolve final PHPCS findings [quality-bot]"
          git push origin HEAD:agent/public-release-hardening
