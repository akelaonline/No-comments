name: Regenerate POT once

on:
  push:
    branches:
      - agent/public-release-hardening

permissions:
  contents: write

jobs:
  pot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-release-hardening

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install WP-CLI i18n command
        run: wp package install wp-cli/i18n-command:@stable

      - name: Generate POT
        run: wp i18n make-pot no-comments no-comments/languages/no-comments.pot --domain=no-comments

      - name: Commit POT
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add no-comments/languages/no-comments.pot
          git diff --cached --check
          git commit -m "Regenerate translation template [i18n-bot]"
          git push origin HEAD:agent/public-release-hardening
